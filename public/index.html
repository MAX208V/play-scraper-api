<!DOCTYPE html>
<!-- v40235 -->
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PricePrism</title>
<style>/* critical FOUC fix */:root{--bg:#e8ebe6;--surface:#fff;--body:#1e2a1a;--mute:#6b7a64;--font:"Inter",-apple-system,BlinkMacSystemFont,sans-serif}*,:before,:after{box-sizing:border-box;margin:0;padding:0}html{font-family:var(--font);background:var(--bg);color:var(--body);font-size:14px;line-height:1.5}body{background:var(--bg)}</style>
<link rel="stylesheet" href="/styles.css">
<link href="https://cors.maxcloud.fun/?url=https%3A%2F%2Ffonts.googleapis.com%2Fcss2%3Ffamily%3DInter%3Aopsz%2Cwght%4014..32%2C400%3B14..32%2C500%3B14..32%2C600%3B14..32%2C700%26display%3Dswap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/icons.css"><script>window.__dashPromise = fetch('/api/dashboard').then(function(r){return r.json()}).catch(function(){return null});</script></head><body>

  <div class="bg-wallpaper" id="bgWallpaper"></div>
  <div class="bg-overlay"></div>

<main class="layout">

  <!-- Hero -->
  <header class="hero" role="banner">
    <div class="hero-content">
      <div class="hero-logo"><span class="material-symbols-rounded" style="font-size:36px;color:var(--primary);" aria-hidden="true">monitoring</span><span class="hero-brand">PricePrism</span></div>
      <p class="hero-sub">Google Play 应用价格监控仪表盘</p>
    </div>
  </header>

  <!-- 搜索卡片（含添加功能） -->
  <section class="card card--search" aria-label="搜索应用">
    <div class="card-header">
      <span class="card-title-badge"><span class="material-symbols-rounded" style="font-size:14px;" aria-hidden="true">search</span> 搜索应用</span>
    </div>
    <div class="search-bar" role="search">
      <input type="text" class="input search-input" id="searchInput" placeholder="输入应用名称或包名…" aria-label="搜索关键词">
      <button class="btn btn--primary" onclick="doSearch()" aria-label="搜索"><span class="material-symbols-rounded" aria-hidden="true">search</span></button>
    </div>
    <div id="searchResults" class="search-results" role="listbox" aria-label="搜索结果"></div>

    <div class="add-collapse">
      <span class="notif-toggle" onclick="toggleNotifHistory()" title="通知记录" role="button" tabindex="0" aria-label="切换通知记录" onkeydown="if(event.key==='Enter')toggleNotifHistory()">
        <span class="material-symbols-rounded" aria-hidden="true">notifications</span>
        <span class="notif-badge" id="historyCount" aria-live="polite">0</span>
      </span>
      <span class="notif-clear" onclick="clearHistory()" title="清空通知" style="font-size:11px;cursor:pointer;opacity:.5;margin-left:2px;" role="button" tabindex="0" aria-label="清空通知" onkeydown="if(event.key==='Enter')clearHistory()">清空</span>
      <span class="add-form-toggle" onclick="toggleAddForm()" role="button" tabindex="0" aria-label="切换添加手动监控表单" onkeydown="if(event.key==='Enter')toggleAddForm()">
        <span class="material-symbols-rounded" aria-hidden="true">add_circle</span>
        <span>添加手动监控</span>
        <span class="material-symbols-rounded add-arrow" aria-hidden="true">expand_more</span>
      </span>
    </div>
    <form class="add-form" id="addForm" onsubmit="handleAddApp(event)" style="display:none;">
      <div class="form-field"><label class="label">包名 *</label><input type="text" class="input" name="app_id" required placeholder="com.example.app"></div>
      <div class="form-field"><label class="label">显示名称</label><input type="text" class="input" name="name" placeholder="留空自动获取"></div>
      <div class="form-field"><label class="label">降价阈值 $</label><input type="number" class="input" name="threshold" step="0.01" min="0.01" value="6" required></div>
      <div class="form-field"><label class="label">备注</label><input type="text" class="input" name="note" placeholder="可选"></div>
      <div class="form-field"><label class="label">监控区域 <button type="button" class="btn btn--ghost btn--sm" onclick="toggleCountryPicker('addCountries')" style="font-size:11px;">选择区域</button></label>
        <div id="addCountries" class="country-grid" style="display:none;"></div>
      </div>
      <label class="toggle"><input type="checkbox" class="toggle-input" name="monitor_mode"><span class="toggle-slider"></span><span class="toggle-label">价格变动时通知（任意变化）</span></label>
      <button class="btn btn--primary btn--full" type="submit">添加</button>
    </form>

    <!-- 通知记录（合入搜索卡片） -->
    <div id="historyList" class="history-list" style="display:block;"></div>
  </section>

  <!-- 监控列表卡片 -->
  <section class="card card--list">
    <div class="card-header">
      <span class="card-title-badge"><span class="material-symbols-rounded" style="font-size:14px;">monitoring</span> 监控列表</span>
      <span class="card-actions">
        <span class="card-badge card-badge-refresh" onclick="checkPrices()" title="立即检查价格"><span class="material-symbols-rounded" style="font-size:11px;line-height:inherit;vertical-align:middle;">refresh</span></span>
        <span class="card-badge" id="appsCount">0</span>
      </span>
    </div>
    <div id="appsList"></div>
  </section>



</main>

<!-- 详情弹窗 -->
<div class="overlay" id="detailOverlay" role="dialog" aria-label="应用详情弹窗" aria-modal="true">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">应用详情</span>
      <button class="btn btn-icon" onclick="closeDetailModal()" aria-label="关闭详情弹窗"><span class="material-symbols-rounded" aria-hidden="true">close</span></button>
    </div>
    <div id="detailContent" class="detail-preview"></div>
    <div class="modal-body">
      <div class="form-field"><label class="label">降价阈值 $</label><input type="number" class="input" id="detailThreshold" step="0.01" min="0.01" value="6"></div>
      <label class="toggle"><input type="checkbox" class="toggle-input" id="detailMonitorMode"><span class="toggle-slider"></span><span class="toggle-label">价格变动时通知</span></label>
      <div class="form-field"><label class="label">备注</label><input type="text" class="input" id="detailNote" placeholder="可选"></div>
      <button class="btn btn--primary btn--full" onclick="addFromDetail()">添加到监控列表</button>
    </div>
  </div>
</div>

<!-- 编辑弹窗 -->
<div class="overlay" id="editOverlay" role="dialog" aria-label="编辑监控弹窗" aria-modal="true">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">编辑监控</span>
      <button class="btn btn-icon" onclick="closeEditModal()" aria-label="关闭编辑弹窗"><span class="material-symbols-rounded" aria-hidden="true">close</span></button>
    </div>
    <div class="modal-body">
      <div class="form-field"><label class="label">应用名称</label><input type="text" class="input" id="editName"></div>
      <div class="form-field"><label class="label">阈值类型</label><select class="input" id="editThresholdType" onchange="document.getElementById('editThresholdPctRow').style.display=this.value==='percent'?'':'none'"><option value="amount">金额 $</option><option value="percent">百分比 %</option></select></div><div class="form-field"><label class="label">降价阈值 $</label><input type="number" class="input" id="editThreshold" step="0.01" min="0.01"></div><div class="form-field" id="editThresholdPctRow" style="display:none"><label class="label">降价百分比 %</label><input type="number" class="input" id="editThresholdPct" step="1" min="1" max="100" value="20"></div>
      <div class="form-field"><label class="label">基准价格 $</label><input type="number" class="input" id="editBasePrice" step="0.01" min="0" placeholder="留空为无基准"></div>
      <div class="form-field"><label class="label">备注</label><input type="text" class="input" id="editNote"></div>
      <div class="form-field"><label class="label">监控区域 <button type="button" class="btn btn--ghost btn--sm" onclick="toggleCountryPicker('editCountries')" style="font-size:11px;">选择区域</button></label>
        <div id="editCountries" class="country-grid" style="display:none;"></div>
      </div>
      <label class="toggle"><input type="checkbox" class="toggle-input" id="editMonitorMode"><span class="toggle-slider"></span><span class="toggle-label">价格变动时通知</span></label>

      <button class="btn btn--primary btn--full" onclick="handleEditApp()">保存修改</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast" role="alert" aria-live="polite" aria-atomic="true"></div>
<!-- 屏幕阅读器专用 -->
<div aria-live="polite" aria-atomic="true" class="sr-only" id="srAnnounce"></div>

<script src="/app.js?v=5"></script>
</body></html>
